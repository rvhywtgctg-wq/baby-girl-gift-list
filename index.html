<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>💗 Baby Girl Shopping List 💗</title>

<style>

body{
font-family:-apple-system,sans-serif;
background:#fff7fa;
margin:0;
padding:15px;
}

header{
text-align:center;
padding:20px;
}

h1{
color:#be6987;
}

.section{
background:white;
border-radius:20px;
margin-bottom:15px;
overflow:hidden;
box-shadow:0 4px 10px rgba(0,0,0,.08);
}

summary{
padding:18px;
font-weight:bold;
background:#fce4ec;
font-size:20px;
cursor:pointer;
}

.item{
padding:15px;
border-bottom:1px solid #eee;
}

.item:last-child{
border-bottom:none;
}

.name{
font-weight:600;
}

.qty{
font-size:13px;
color:#777;
}

.claim-btn{
margin-top:10px;
background:#be6987;
color:white;
border:none;
padding:10px;
border-radius:10px;
width:100%;
}

.claimed{
background:#ffe2ee;
}

.claimed-name{
margin-top:8px;
color:#be6987;
font-weight:bold;
}

.progress{
background:white;
padding:15px;
border-radius:20px;
margin-bottom:20px;
text-align:center;
font-weight:bold;
}

</style>
</head>

<body>

<header>
<h1>💗 Baby Girl Shopping List 💗</h1>
<p>Choose something you'd like to buy.</p>
</header>

<div class="progress">
<span id="progress">Loading...</span>
</div>

<div id="content"></div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";

import {
getFirestore,
collection,
doc,
setDoc,
getDocs,
onSnapshot
}
from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig = {
apiKey:"AIzaSyBlKzM5qlgHTXuNn4p5BrMyjJxXLpNhWAY",
authDomain:"baby-gift-list.firebaseapp.com",
projectId:"baby-gift-list",
storageBucket:"baby-gift-list.firebasestorage.app",
messagingSenderId:"564970289812",
appId:"1:564970289812:web:0f9377f1d675a53254d281"
};


const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const categories = {

"👗 Clothing":[
["Bodysuits","6-8"],
["Sleepsuits / Babygrows","6-8"],
["Cardigans / Jumpers","2-3"],
["Socks","4-6 pairs"],
["Soft Hats","2-3"],
["Warm Outdoor Layer","1-2"],
["Going Home Outfit","1-2"],
["Scratch Mitts","1-2 pairs"]
],

"🛏 Sleeping":[
["Cot / Bedside Crib","1"],
["Mattress","1"],
["Fitted Sheets","3-4"],
["Cellular Blankets","2-3"],
["Sleeping Bags","2-3"],
["Mattress Protectors","2"],
["Room Thermometer","1"]
],

"🧷 Nappies & Changing":[
["Newborn Nappies","1-2 packs"],
["Baby Wipes","1-2 packs"],
["Changing Mat","1"],
["Barrier Cream","1"],
["Nappy Bags","1 pack"],
["Muslin Cloths","10-15"]
],

"🍼 Feeding":[
["Baby Bottles","4-6"],
["Steriliser","1"],
["Bibs","5-8"],
["Breast Pump","Optional"]
],

"🚗 Getting Around":[
["Car Seat","1"],
["Pram","1"],
["Changing Bag","1"],
["Pram Rain Cover","1"],
["Baby Carrier","Optional"]
],

"🏡 Home":[
["Baby Monitor","1"],
["Night Light","1"],
["Storage Baskets","2-3"],
["Laundry Basket","1"]
]
};

for(const section in categories){

for(const item of categories[section]){

await setDoc(
doc(db,"items",item[0].replaceAll("/","-")),

{
name:"",
claimed:false,
qty:item[1],
category:section
},
{merge:true}
);

}
}

onSnapshot(collection(db,"items"),snapshot=>{

const items=[];

snapshot.forEach(docu=>{
items.push({
id:docu.id,
...docu.data()
});
});

const claimed=items.filter(i=>i.claimed).length;

document.getElementById("progress").innerText=
`${claimed} of ${items.length} items claimed`;

let html="";

for(const section in categories){

html+=`
<details class="section" open>
<summary>${section}</summary>
`;

categories[section].forEach(item=>{

const record=items.find(x=>x.id===item[0].replaceAll("/","-"));


if(!record)return;

html+=`
<div class="item ${record.claimed ? 'claimed' : ''}">
<div class="name">${record.id}</div>
<div class="qty">Need: ${record.qty}</div>
`;

if(record.claimed){

html+=`
<div class="claimed-name">
✅ Claimed by ${record.name}
</div>
`;

}else{

html+=`
<button class="claim-btn"
onclick="claimItem('${record.id}')">
Claim This Item
</button>
`;

}

html+=`</div>`;

});

html+=`</details>`;
}

document.getElementById("content").innerHTML=html;

window.claimItem=async function(name){

const buyer=prompt("Your name");

if(!buyer) return;

await setDoc(
doc(db,"items",name),
{
name:buyer,
claimed:true
},
{merge:true}
);

}

});

</script>

</body>
</html>
