<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baby Girl Gift List 💗</title>

<style>
body{
font-family:Arial,sans-serif;
background:#fff5f9;
max-width:800px;
margin:auto;
padding:20px;
}

h1{
text-align:center;
color:#d65d8a;
}

.item{
background:white;
margin:10px 0;
padding:15px;
border-radius:12px;
box-shadow:0 2px 6px rgba(0,0,0,.1);
cursor:pointer;
}

.claimed{
background:#ffddeb;
}

.name{
margin-top:10px;
font-size:14px;
color:#666;
}
</style>
</head>

<body>

<h1>💗 Baby Girl Gift List 💗</h1>

<p>Tap an item to claim it.</p>

<div id="list"></div>

<script>

const items = [
"Bodysuits",
"Sleepsuits",
"Cardigans",
"Socks",
"Soft hats",
"Cot / bedside crib",
"Mattress",
"Fitted sheets",
"Cellular blankets",
"Sleeping bags",
"Newborn nappies",
"Baby wipes",
"Changing mat",
"Barrier cream",
"Muslin cloths",
"Baby bottles",
"Steriliser",
"Baby bath",
"Hooded towels",
"Digital thermometer",
"Car seat",
"Pram",
"Changing bag",
"Baby carrier",
"Baby monitor",
"Night light",
"Play mat",
"Bouncer",
"Keepsake box",
"White noise machine"
];

const list=document.getElementById('list');

items.forEach(item=>{

const box=document.createElement('div');

box.className='item';

box.innerHTML=`
<strong>${item}</strong>
<div class="name">Available</div>
`;

box.onclick=()=>{

const name=prompt("What's your name?");

if(!name)return;

box.classList.add('claimed');

box.querySelector('.name').innerText=
'Claimed by ' + name;

};

list.appendChild(box);

});

</script>

</body>
</html>
